services:
  datarace:
    build: .
    ports:
      - "5173:5173"
    environment:
      - DATABASE_URL=postgresql://datarace:password@postgres:5432/datarace_db
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: datarace
      POSTGRES_PASSWORD: password
      POSTGRES_DB: datarace_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
